name: Build Minecraft GTA V Story Mode ASI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-minecraft-gta5-asi.yml'
      - 'examples/minecraft-gta5-passthrough/gta/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build dependencies
        shell: bash
        run: |
          cd examples/minecraft-gta5-passthrough/gta
          ./fetch_deps.sh

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build ASI
        shell: cmd
        run: examples\minecraft-gta5-passthrough\gta\build.bat

      - uses: actions/upload-artifact@v4
        with:
          name: MCPassthrough-Story-Mode
          path: examples/minecraft-gta5-passthrough/gta/build/MCPassthrough.asi
          if-no-files-found: error
          retention-days: 1
